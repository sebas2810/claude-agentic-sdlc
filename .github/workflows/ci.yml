name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (warning severity gate)
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: offline bootstrap smoke test (stubbed gh, fake product repo)
        run: bash onboarding/tests/smoke-bootstrap.sh
