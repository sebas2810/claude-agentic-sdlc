name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck (warning severity gate)
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: offline bootstrap smoke test (stubbed gh, fake product repo)
        run: bash onboarding/tests/smoke-bootstrap.sh

  # The controls' own tests. Every check here guards a control that, when it
  # silently stops enforcing, leaves no trace: the hook still fires, the repo
  # still builds, CI stays green. Both suites are both-directions — each has been
  # observed to FAIL against the tree that carried the defect it exists for, so a
  # pass is evidence rather than decoration.
  control-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: git guard — protected refs, repo scoping, escape hatch (7 cases)
        run: |
          set -euo pipefail
          # PM finding (folded into #5239): isolate global git identity —
          # a self-hosted runner (or `act` locally) reuses its HOME across
          # jobs, so writing straight to the real ~/.gitconfig here is the
          # same class of pollution onboarding/tests/delivery-check.test.sh
          # was fixed for. GIT_CONFIG_GLOBAL (git >=2.32) is exported so it
          # also covers the scripts this step execs.
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          bash onboarding/hooks/guard-git.test.sh onboarding/hooks/guard-git.sh
      - name: seat launcher — the permission gate is never disabled
        run: bash onboarding/tests/seat-launch-permission-posture.test.sh onboarding/seat-launch.sh
      - name: sync — an append-only instance log is merged, never overwritten
        run: bash onboarding/tests/merge-append-only-log.test.sh onboarding/lib/merge-append-only-log.sh
      - name: sync — a running script survives being replaced by its own apply
        run: bash onboarding/tests/atomic-install.test.sh
      - name: sync — an index carrying local-only rows is never overwritten
        run: bash onboarding/tests/check-no-local-only-rows.test.sh onboarding/lib/check-no-local-only-rows.sh
      - name: git guard — parity with the instance-fork rules it replaces
        run: |
          set -euo pipefail
          # PM finding (folded into #5239): isolate global git identity —
          # a self-hosted runner (or `act` locally) reuses its HOME across
          # jobs, so writing straight to the real ~/.gitconfig here is the
          # same class of pollution onboarding/tests/delivery-check.test.sh
          # was fixed for. GIT_CONFIG_GLOBAL (git >=2.32) is exported so it
          # also covers the scripts this step execs.
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          bash onboarding/hooks/guard-git.parity.test.sh onboarding/hooks/guard-git.sh
      - name: setup-seat — settings.local.json written idempotently (#76 AC4)
        run: bash onboarding/tests/setup-seat-settings.test.sh onboarding/setup-seat.sh
      - name: seat statusline — shows context TOKENS against a real 2.1.270 payload (#76 AC4 re-delivery)
        run: bash onboarding/tests/seat-statusline.test.sh onboarding/lib/seat-statusline.sh
      - name: metrics - seat-tokens.py known answer, and an error on unreadable input
        run: python3 operations/metrics/tests/test_seat_tokens.py
      - name: metrics - flow.py known answer, and an error when gh fails
        run: python3 operations/metrics/tests/test_flow.py
      - name: delivery-check — proof before Delivered (pass, hollow proof, stale stamp, close-keyword)
        run: |
          set -euo pipefail
          # PM finding (folded into #5239): isolate global git identity —
          # a self-hosted runner (or `act` locally) reuses its HOME across
          # jobs, so writing straight to the real ~/.gitconfig here is the
          # same class of pollution onboarding/tests/delivery-check.test.sh
          # was fixed for. GIT_CONFIG_GLOBAL (git >=2.32) is exported so it
          # also covers the scripts this step execs.
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          bash onboarding/tests/delivery-check.test.sh onboarding/lib/delivery-check.sh onboarding/hooks/guard-git.sh
      - name: workers - each worker definition still carries its seat rules
        run: bash onboarding/tests/worker-definitions.test.sh onboarding/lib/check-worker-definitions.sh
      - name: workers - the quality seat's parallel cap is resolved or refused, never guessed
        run: bash onboarding/tests/resolve-qa-max-parallel.test.sh onboarding/lib/resolve-qa-max-parallel.sh
      - name: seat commands - each instance's seats run their own /check, ~/.claude/commands untouched (#77)
        run: bash onboarding/tests/seat-commands-per-instance.test.sh
      - name: plugin version - a shipped command, skill, agent or hook change must raise it (#77)
        run: bash onboarding/tests/check-plugin-version-bump.test.sh onboarding/lib/check-plugin-version-bump.sh

  # A shipped change (commands, skills, agents, hooks, the manifest) without a higher plugin version
  # leaves every installed plugin cache on the old commands (#77). Needs full history for the merge-base.
  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: plugin.json version raised when shipped plugin content changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash onboarding/lib/check-plugin-version-bump.sh "origin/$BASE_REF"
